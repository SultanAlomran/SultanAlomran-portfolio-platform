@if (drawerService.isOpen()) {
  <div class="fixed inset-0 z-50 overflow-hidden" role="dialog" aria-modal="true" aria-labelledby="contact-drawer-title">
    <!-- Backdrop -->
    <div
      class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs transition-opacity"
      aria-hidden="true"
      (click)="close()"
    ></div>

    <!-- Drawer Panel Container -->
    <div class="fixed inset-y-0 right-0 flex max-w-full pl-0 sm:pl-10">
      <div class="w-screen max-w-xl transform bg-white shadow-2xl transition-transform ease-in-out">
        <!-- Header -->
        <div class="flex items-center justify-between border-b border-slate-200 bg-slate-50/80 px-6 py-4">
          <div class="flex items-center gap-2.5">
            <div class="grid size-8 place-items-center rounded-lg bg-violet-100 text-violet-700">
              <svg class="size-4.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
              </svg>
            </div>
            <div>
              <h2 id="contact-drawer-title" class="text-base font-bold text-slate-900">
                Contact Sultan
              </h2>
              <p class="text-xs text-slate-500">Direct message channel</p>
            </div>
          </div>
          <button
            #closeBtn
            type="button"
            (click)="close()"
            class="grid size-9 place-items-center rounded-xl text-slate-500 hover:bg-slate-200/70 hover:text-slate-900 focus:outline-none focus:ring-2 focus:ring-violet-600"
            aria-label="Close contact drawer"
          >
            <svg class="size-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>

        <!-- Body / Shared Form -->
        <div class="h-[calc(100vh-65px)] overflow-y-auto p-6">
          <app-contact-form
            [showBackToHome]="false"
            [showCloseButton]="true"
            (dismiss)="close()"
          />
        </div>
      </div>
    </div>
  </div>
}
