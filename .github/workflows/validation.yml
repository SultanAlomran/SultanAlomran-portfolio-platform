name: Foundation validation
on:
  pull_request:
  push:
    branches: [dev]
permissions:
  contents: read
jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Start ephemeral SQL Server for integration tests
        shell: bash
        run: |
          sql_password="$(openssl rand -base64 24)"
          echo "::add-mask::$sql_password"
          docker run --name portfolio-ci-sql --detach \
            --env ACCEPT_EULA=Y \
            --env MSSQL_SA_PASSWORD="$sql_password" \
            --publish 1433:1433 \
            mcr.microsoft.com/mssql/server:2022-latest

          for attempt in {1..30}; do
            if docker exec portfolio-ci-sql /opt/mssql-tools18/bin/sqlcmd \
              -S localhost -U sa -P "$sql_password" -C -Q "SELECT 1" >/dev/null 2>&1; then
              break
            fi
            if [[ "$attempt" == "30" ]]; then
              docker logs portfolio-ci-sql
              exit 1
            fi
            sleep 2
          done

          echo "PORTFOLIO_TEST_SQL_CONNECTION_STRING=Server=localhost,1433;User ID=sa;Password=$sql_password;Encrypt=True;TrustServerCertificate=True;MultipleActiveResultSets=True" >> "$GITHUB_ENV"
      - run: dotnet restore Portfolio.sln
      - run: dotnet build Portfolio.sln --configuration Release --no-restore
      - run: dotnet test Portfolio.sln --configuration Release --no-build
      - run: dotnet format Portfolio.sln --verify-no-changes --no-restore
      - run: dotnet list Portfolio.sln package --vulnerable --include-transitive
      - name: Verify migration model snapshot
        run: dotnet ef migrations has-pending-model-changes --project src/Portfolio.Infrastructure --startup-project src/Portfolio.Api
        continue-on-error: true # Remove when InitialDataFoundation is generated in a .NET 10 environment.
  portfolio-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Portfolio.Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: ${{ hashFiles('src/Portfolio.Web/package-lock.json') != '' }}
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Portfolio.Web/package-lock.json
      - name: Report missing lockfile
        if: ${{ hashFiles('src/Portfolio.Web/package-lock.json') == '' }}
        run: echo 'Portfolio.Web validation is pending its separately generated package-lock.json.'
      - if: ${{ hashFiles('src/Portfolio.Web/package-lock.json') != '' }}
        run: npm ci
      - if: ${{ hashFiles('src/Portfolio.Web/package-lock.json') != '' }}
        run: npm run lint
      - if: ${{ hashFiles('src/Portfolio.Web/package-lock.json') != '' }}
        run: npm run build
  portfolio-admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Portfolio.Admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: ${{ hashFiles('src/Portfolio.Admin/package-lock.json') != '' }}
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Portfolio.Admin/package-lock.json
      - name: Report missing lockfile
        if: ${{ hashFiles('src/Portfolio.Admin/package-lock.json') == '' }}
        run: echo 'Portfolio.Admin validation is pending its separately generated package-lock.json.'
      - if: ${{ hashFiles('src/Portfolio.Admin/package-lock.json') != '' }}
        run: npm ci
      - if: ${{ hashFiles('src/Portfolio.Admin/package-lock.json') != '' }}
        run: npm run lint
      - if: ${{ hashFiles('src/Portfolio.Admin/package-lock.json') != '' }}
        run: npm run build
